name = "atk422/hydrogen"
version = "0.3.0"
description = "A mildly opinionated luau framework/bootstrapper"
authors = ["atk422"]
license = "MIT"
repository = "https://github.com/ATK422/Hydrogen"
includes = [
	"pesde.toml",
	"README.md",
	"LICENSE",
	"CHANGELOG.md",
	"src/**/*.luau",
	"src/.luaurc",
]

[target]
environment = "roblox"
lib = "src/init.luau"
build_files = ["src"]

[indices]
default = "https://github.com/pesde-pkg/index"

[scripts]
roblox_sync_config_generator = ".pesde/scripts/roblox_sync_config_generator.luau"
sourcemap_generator = ".pesde/scripts/sourcemap_generator.luau"
test = "test/_run.luau"

[dependencies]
gt = { name = "corecii/greentea", version = "^0.4.11" }

[dev_dependencies]
scripts = { name = "pesde/scripts_rojo", version = "^0.2.0", target = "lune" }
rojo = { name = "pesde/rojo", version = "^7.5.1", target = "lune" }
frktest = { name = "itsfrank/frktest", version = "^0.0.4", target = "luau" }

[engines]
pesde = "^0.7.0"
lune = "^0.10.2"
