name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up pesde
        uses: pesde-pkg/setup@v1
        with:
          version: "0.7.2"
          lune-version: "v0.10.5"

      - name: Install dependencies
        run: pesde install --locked

      # pesde run hands off to a `lune` executable, so the setup step must install Lune.
      - name: Run tests
        run: pesde run test

      - name: Test the project generator
        working-directory: tools/create-hydrogen
        run: lune run test/run

      # Game code calling Hydrogen must type-check in strict mode with the luau-lsp version new games
      # pin. Hydrogen's own source is ignored, as a game's CI ignores roblox_packages.
      - name: Install luau-lsp
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Type-check game usage
        run: |
          curl -sSfL -o globalTypes.d.luau https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/1.70.1/scripts/globalTypes.d.luau
          luau-lsp analyze --platform=roblox --sourcemap=sourcemap.json --definitions=@roblox=globalTypes.d.luau --ignore="src/**" --ignore="**/roblox_packages/**" test/Types
