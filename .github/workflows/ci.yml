name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up pesde
        uses: pesde-pkg/setup@v1
        with:
          version: "0.7.2"
          lune-version: "0.10.5"

      - name: Install dependencies
        run: pesde install --locked

      # Runs Lune directly; `pesde run test` aborts on the Linux runner (exit 134).
      - name: Run tests
        run: lune run test/_run.luau
