name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pesde
        run: |
          curl -sSL -o "$RUNNER_TEMP/pesde.zip" "https://github.com/pesde-pkg/pesde/releases/download/v0.7.2%2Bregistry.0.2.3/pesde-0.7.2-linux-x86_64.zip"
          unzip -q "$RUNNER_TEMP/pesde.zip" -d "$RUNNER_TEMP/pesde"
          chmod +x "$RUNNER_TEMP/pesde/pesde"
          "$RUNNER_TEMP/pesde/pesde" self-install --skip-add-to-path
          echo "$HOME/.pesde/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pesde install --locked

      - name: Run tests
        run: pesde run test
