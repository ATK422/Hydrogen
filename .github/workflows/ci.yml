name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up pesde
        uses: pesde-pkg/setup@v1
        with:
          version: "0.7.2"
          lune-version: "v0.10.5"

      - name: Install dependencies
        run: pesde install --locked

      # pesde run hands off to a `lune` executable, so the setup step must install Lune.
      - name: Run tests
        run: pesde run test
